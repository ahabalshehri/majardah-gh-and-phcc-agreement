<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نسبة استلام بيانات المراكز الصحية</title>
<style>
  :root {
    --bg: #f4f8fb;
    --surface: #ffffff;
    --surface-2: #eaf2f8;
    --text: #142430;
    --text-muted: #5c7080;
    --border: #dbe6ee;
    --primary: #1c7fc4;
    --primary-dark: #0f5a91;
    --primary-tint: #e3f2fb;
    --danger: #b3261e;
    --danger-tint: #fbeceb;
    --shadow: 0 1px 2px rgba(15, 35, 50, 0.05), 0 8px 24px rgba(15, 35, 50, 0.07);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c161f;
      --surface: #12212c;
      --surface-2: #182c39;
      --text: #e7f0f5;
      --text-muted: #92aab8;
      --border: #223c4c;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
  }

  body {
    font-family: "Segoe UI", Tahoma, "Noto Kufi Arabic", Arial, sans-serif;
    line-height: 1.6;
    padding: 32px 16px 60px;
  }

  .page {
    max-width: 520px;
    margin: 0 auto;
  }

  h1 {
    font-size: 19px;
    margin: 0 0 20px;
    text-align: center;
  }

  .card-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    box-shadow: var(--shadow);
  }

  canvas {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 10px;
    background: var(--surface);
  }

  .status-line {
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
    margin: 14px 0 0;
    min-height: 18px;
  }

  .status-line.error {
    color: var(--danger);
  }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
  }

  button {
    font: inherit;
    font-size: 14.5px;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    cursor: pointer;
    flex: 1 1 auto;
  }

  .btn-primary {
    color: #fff;
    background: linear-gradient(155deg, var(--primary), var(--primary-dark));
  }

  .btn-secondary {
    color: var(--primary-dark);
    background: var(--primary-tint);
    border: 1px solid var(--primary);
  }

  button:disabled {
    opacity: 0.6;
    cursor: progress;
  }

  .back-link {
    display: block;
    text-align: center;
    margin-top: 22px;
    font-size: 13px;
    color: var(--text-muted);
  }
</style>
</head>
<body>
  <div class="page">
    <h1>نسبة استلام بيانات المراكز الصحية</h1>
    <div class="card-wrap">
      <canvas id="card" width="1080" height="1410"></canvas>
      <p class="status-line" id="status-line">جارٍ التحميل...</p>
    </div>
    <div class="actions">
      <button type="button" class="btn-primary" id="download-btn" disabled>تنزيل الصورة</button>
      <button type="button" class="btn-secondary" id="refresh-btn">تحديث</button>
    </div>
    <a class="back-link" href="index.html">العودة إلى نموذج البيانات</a>
  </div>

TZhayjGnQwNpn7ZOulRzuv7Fhl7lPbz3HaRoP/B6KDSvGQc/GoAAAAAElFTkSuQmCC";

    var canvas = document.getElementById("card");
    var ctx = canvas.getContext("2d");
    var statusLine = document.getElementById("status-line");
    var downloadBtn = document.getElementById("download-btn");
    var refreshBtn = document.getElementById("refresh-btn");

    var COLORS = {
      bannerFrom: "#0f5a91",
      bannerTo: "#1c7fc4",
      bg: "#ffffff",
      panel: "#f4f8fb",
      panelBorder: "#dbe6ee",
      text: "#142430",
      muted: "#5c7080",
      track: "#e3f2fb",
      ring: "#1c7fc4",
      ringBariq: "#1c7fc4",
      ringMajardah: "#0f5a91",
      divider: "#e3e9ee"
    };

    var logoReady = new Promise(function (resolve) {
      var img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = function () { resolve(null); };
      img.src = LOGO_SRC;
    });

    function drawRoundedRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawArc(cx, cy, radius, lineWidth, percentage, color, trackColor) {
      ctx.lineCap = "round";
      ctx.lineWidth = lineWidth;

      ctx.strokeStyle = trackColor;
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.stroke();

      var start = -Math.PI / 2;
      var end = start + (Math.PI * 2 * (Math.min(percentage, 100) / 100));
      ctx.strokeStyle = color;
      ctx.beginPath();
      ctx.arc(cx, cy, radius, start, end);
      ctx.stroke();
    }

    function drawBar(x, y, w, h, percentage, color, trackColor) {
      drawRoundedRect(x, y, w, h, h / 2);
      ctx.fillStyle = trackColor;
      ctx.fill();

      var fillW = Math.max(h, w * (Math.min(percentage, 100) / 100));
      drawRoundedRect(x, y, fillW, h, h / 2);
      ctx.fillStyle = color;
      ctx.fill();
    }

    function drawSectorCard(x, y, w, h, title, sector, accentColor) {
      ctx.save();
      ctx.shadowColor = "rgba(15, 35, 50, 0.08)";
      ctx.shadowBlur = 18;
      ctx.shadowOffsetY = 6;
      drawRoundedRect(x, y, w, h, 22);
      ctx.fillStyle = COLORS.panel;
      ctx.fill();
      ctx.restore();

      drawRoundedRect(x, y, w, h, 22);
      ctx.strokeStyle = COLORS.panelBorder;
      ctx.lineWidth = 2;
      ctx.stroke();

      var pad = 40;

      // accent dot
      ctx.beginPath();
      ctx.arc(x + w - pad - 10, y + pad + 6, 10, 0, Math.PI * 2);
      ctx.fillStyle = accentColor;
      ctx.fill();

      ctx.textAlign = "right";
      ctx.fillStyle = COLORS.text;
      ctx.font = "700 32px 'Segoe UI', Tahoma, Arial, sans-serif";
      ctx.fillText(title, x + w - pad - 32, y + pad + 16);

      ctx.textAlign = "left";
      ctx.fillStyle = accentColor;
      ctx.font = "700 44px 'Segoe UI', Tahoma, Arial, sans-serif";
      ctx.fillText(sector.percentage + "%", x + pad, y + pad + 20);

      ctx.textAlign = "right";
      ctx.fillStyle = COLORS.muted;
      ctx.font = "400 26px 'Segoe UI', Tahoma, Arial, sans-serif";
      ctx.fillText(sector.submitted + " من " + sector.total + " مركزًا", x + w - pad, y + pad + 62);

      drawBar(x + pad, y + h - 46, w - pad * 2, 18, sector.percentage, accentColor, COLORS.track);
    }

    function render(stats, logoImg) {
      var W = canvas.width, H = canvas.height;
      ctx.direction = "rtl";
      ctx.clearRect(0, 0, W, H);

      // page background
      ctx.fillStyle = COLORS.bg;
      ctx.fillRect(0, 0, W, H);

      // banner
      var bannerH = 300;
      var grad = ctx.createLinearGradient(0, 0, W, bannerH);
      grad.addColorStop(0, COLORS.bannerFrom);
      grad.addColorStop(1, COLORS.bannerTo);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, bannerH);

      // logo chip
      var chipSize = 140, chipX = (W - chipSize) / 2, chipY = 46;
      ctx.save();
      ctx.shadowColor = "rgba(6, 25, 40, 0.25)";
      ctx.shadowBlur = 16;
      ctx.shadowOffsetY = 4;
      drawRoundedRect(chipX, chipY, chipSize, chipSize, 28);
      ctx.fillStyle = "#ffffff";
      ctx.fill();
      ctx.restore();

      if (logoImg) {
        var pad = 18;
        var innerSize = chipSize - pad * 2;
        var scale = Math.min(innerSize / logoImg.width, innerSize / logoImg.height);
        var dw = logoImg.width * scale, dh = logoImg.height * scale;
        ctx.drawImage(
          logoImg,
          chipX + (chipSize - dw) / 2,
          chipY + (chipSize - dh) / 2,
          dw, dh
        );
      }

      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "center";
      ctx.font = "700 38px 'Segoe UI', Tahoma, Arial, sans-serif";
      ctx.fillText("تجمع عسير الصحي", W / 2, chipY + chipSize + 56);
      ctx.font = "400 26px 'Segoe UI', Tahoma, Arial, sans-serif";
      ctx.globalAlpha = 0.9;
      ctx.fillText("مستشفى المجاردة العام", W / 2, chipY + chipSize + 96);
      ctx.globalAlpha = 1;

      // title
      ctx.fillStyle = COLORS.muted;
      ctx.font = "700 24px 'Segoe UI', Tahoma, Arial, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("تقرير حالة التنسيق مع المراكز الصحية", W / 2, bannerH + 66);

      ctx.fillStyle = COLORS.text;
      ctx.font = "700 36px 'Segoe UI', Tahoma, Arial, sans-serif";
      ctx.fillText("نسبة استلام بيانات المراكز الصحية", W / 2, bannerH + 112);

      // overall ring
      var ringCx = W / 2, ringCy = bannerH + 340, ringR = 175;
      ctx.save();
      ctx.shadowColor = "rgba(28, 127, 196, 0.18)";
      ctx.shadowBlur = 24;
      drawArc(ringCx, ringCy, ringR, 36, stats.percentage, COLORS.ring, COLORS.track);
      ctx.restore();

      ctx.fillStyle = COLORS.text;
      ctx.font = "700 100px 'Segoe UI', Tahoma, Arial, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(stats.percentage + "%", ringCx, ringCy + 34);

      ctx.fillStyle = COLORS.muted;
      ctx.font = "700 30px 'Segoe UI', Tahoma, Arial, sans-serif";
      ctx.fillText(stats.submitted + " من " + stats.total + " مركزًا صحيًا", ringCx, ringCy + 86);

      // divider
      var dividerY = bannerH + 560;
      ctx.strokeStyle = COLORS.divider;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(80, dividerY);
      ctx.lineTo(W - 80, dividerY);
      ctx.stroke();

      // sector breakdown
      var bariq = stats.sectors["بارق"] || { total: 0, submitted: 0, percentage: 0 };
      var majardah = stats.sectors["المجاردة"] || { total: 0, submitted: 0, percentage: 0 };

      var cardW = W - 160, cardH = 190;
      var cardX = 80;
      drawSectorCard(cardX, dividerY + 40, cardW, cardH, "قطاع بارق", bariq, COLORS.ringBariq);
      drawSectorCard(cardX, dividerY + 40 + cardH + 26, cardW, cardH, "قطاع المجاردة", majardah, COLORS.ringMajardah);

      // footer
      var updated = new Date(stats.updatedAt);
      var updatedText = "محدث حتى " + updated.toLocaleString("ar-SA", { dateStyle: "medium", timeStyle: "short" });
      ctx.textAlign = "center";
      ctx.fillStyle = COLORS.muted;
      ctx.font = "400 24px 'Segoe UI', Tahoma, Arial, sans-serif";
      ctx.fillText(updatedText, W / 2, H - 36);
    }

    function setStatus(text, isError) {
      statusLine.textContent = text;
      statusLine.classList.toggle("error", !!isError);
    }

    function load() {
      setStatus("جارٍ التحميل...");
      downloadBtn.disabled = true;
      refreshBtn.disabled = true;

      Promise.all([
        fetch(STATS_URL).then(function (r) {
          if (!r.ok) throw new Error("bad status " + r.status);
          return r.json();
        }),
        logoReady
      ])
        .then(function (results) {
          render(results[0], results[1]);
          setStatus("تم التحديث بنجاح");
          downloadBtn.disabled = false;
        })
        .catch(function () {
          setStatus("تعذّر تحميل البيانات. الرجاء المحاولة مرة أخرى.", true);
        })
        .finally(function () {
          refreshBtn.disabled = false;
        });
    }

    downloadBtn.addEventListener("click", function () {
      var link = document.createElement("a");
      link.download = "نسبة-استلام-البيانات.png";
      link.href = canvas.toDataURL("image/png");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    refreshBtn.addEventListener("click", load);

    load();
  })();
</script>
